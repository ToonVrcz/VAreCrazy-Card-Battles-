<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VAreCrazy Card Battle</title><script src="/card-renderer.js"></script><script src="/engine.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#120620;color:#f3e2b0;font:13px system-ui,sans-serif;touch-action:manipulation}
#app{max-width:520px;margin:0 auto;padding:6px;display:flex;flex-direction:column;gap:5px;min-height:100vh}
.bar{display:flex;justify-content:space-between;align-items:center;gap:6px;background:#2a1244;border:1px solid #6b4a9a;border-radius:8px;padding:5px 8px}
.lp{cursor:default;font-weight:700}.lp.tg{outline:2px solid #ffd54a;animation:pl 1s infinite}
.row{display:grid;gap:3px;position:relative}.f{grid-template-columns:repeat(7,1fr)}.b{grid-template-columns:repeat(5,1fr);width:72%;margin:0 auto}
.c{position:relative;aspect-ratio:2/3;background:#1e0d33;border:1px solid #4a3270;border-radius:5px;overflow:visible}
.c img{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block}
.c .st{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font-size:8px;white-space:nowrap;letter-spacing:-.5px;font-weight:700;background:#000b;padding:0 2px;border-radius:0 0 4px 4px}
.c .lv{position:absolute;top:0;left:0;background:#000b;font-size:8px;padding:0 2px;border-radius:4px 0 4px 0}
.c.sel{outline:2px solid #4fc3f7}.c.tg{outline:2px solid #ffd54a;animation:pl 1s infinite}.c.done{filter:grayscale(.7) brightness(.7)}.c.lock::after{content:"🔒";position:absolute;top:0;right:1px;font-size:10px}
@keyframes pl{50%{outline-color:#fff}}.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.hand .c{border-color:#e2b440}
.fl{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:900;font-size:15px;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none;animation:up 1.2s forwards;z-index:5}
@keyframes up{to{top:-30%;opacity:0}}
button{background:#5b2d90;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:700}button.g{background:#2f7d3a}button.r{background:#a33}button:disabled{opacity:.4}
.hint{text-align:center;background:#3b2a00;border:1px solid #e2b440;border-radius:8px;padding:6px}
#md{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20;padding:10px}#md.on{display:flex}
.box{background:#1b0b2e;border:1px solid #6b4a9a;border-radius:12px;padding:10px;max-width:420px;width:100%;max-height:94vh;overflow:auto}
.box svg{width:62%;display:block;margin:0 auto}.box p{margin:5px 0;font-size:12px}.acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
#lg{font-size:11px;color:#bba;max-height:70px;overflow:auto;background:#0004;border-radius:6px;padding:3px 6px}
.t{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#a33;color:#fff;padding:6px 12px;border-radius:8px;z-index:30}
</style></head><body><div id="app"></div><div id="md"></div>
<script>
const E=VCZE.engine,DEFS=VCZE.defs,BY=Object.fromEntries(DEFS.map(d=>[d.id,d]));
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let G,mode=null,busy=false,snap=null,showLog=false,sel=null;
let PAIRS=VCZE.pairs.slice();if(!PAIRS.length&&/demo/.test(location.search)){const ch=[...new Set(DEFS.filter(d=>d.type==='character').map(d=>d.chain))];for(let i=0;i<ch.length;i++)for(let j=i+1;j<ch.length;j++)PAIRS.push({a:ch[i],b:ch[j],hp:20,atk:10,def:0})}
const PH={main:'เฟสหลัก',battle:'เฟสต่อสู้'};
const img=c=>BY[c.id]?.img||'';
const DK={size:40,max:3,min15:3,slots:10,evoMax:15};
let ME={inv:{},points:0,vrcoin:0,matches:0,matchesToVrcoin:10,ok:false},PK=null;try{PK=localStorage.getItem('vcz_pk')}catch(e){}
const API=(p,o={},h={})=>fetch('/api/play'+p,{...o,headers:{'content-type':'application/json',...(PK?{'x-player-key':PK}:{}),...h}}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'เกิดข้อผิดพลาด');return j});
async function refreshMe(){try{if(!PK){const p=await API('/profile',{method:'POST',body:'{}'});PK=p.key;try{localStorage.setItem('vcz_pk',PK)}catch(e){}}
 const m=await API('/me');ME={...m,inv:m.inventory||{},ok:true}}catch(e){if(/คีย์|โปรไฟล์/.test(e.message)&&PK){PK=null;try{localStorage.removeItem('vcz_pk')}catch(x){}}ME.ok=false}return ME}
const uid=()=>Math.random().toString(36).slice(2,8);
function loadStore(){try{const x=JSON.parse(localStorage.getItem('vcz_decks')||'null');if(x&&Array.isArray(x.list))return{active:x.active||null,list:x.list.map(d=>({id:d.id||uid(),name:String(d.name||'เด็ค').slice(0,24),cards:(d.cards||[]).filter(id=>BY[id]),evo:Array.isArray(d.evo)?d.evo.filter(id=>BY[id]):null}))}}catch(e){}
 try{const o=JSON.parse(localStorage.getItem('vcz_deck')||'null');if(Array.isArray(o)){const id=uid();return{active:id,list:[{id,name:'เด็คของฉัน',cards:o.filter(k=>BY[k]),evo:null}]}}}catch(e){}
 return{active:null,list:[]}}
let DS=loadStore();
function saveStore(){try{localStorage.setItem('vcz_decks',JSON.stringify(DS))}catch(e){}}
function evoProblem(evo){if(!evo)return null;if(evo.length>DK.evoMax)return`เด็คอีโวมีได้ไม่เกิน ${DK.evoMax} ใบ`;const n={};for(const id of evo){n[id]=(n[id]||0)+1;if(!BY[id]||!isForm(BY[id]))return`${BY[id]?.name||id} ใส่เด็คอีโวไม่ได้`;if(n[id]>Math.min(DK.max,ME.inv[id]||0))return`มี ${BY[id].name} ไม่พอ (มี ${ME.inv[id]||0} ใบ)`}return null}
function deckProblem(cards){const fm=cards.find(id=>BY[id]&&isForm(BY[id]));if(fm)return`${BY[fm].name} (Lv.${BY[fm].level}) ต้องอยู่ในเด็คอีโว`;if(cards.length!==DK.size)return`ต้องครบ ${DK.size} ใบ (ตอนนี้ ${cards.length})`;const n={};for(const id of cards){n[id]=(n[id]||0)+1;if(n[id]>DK.max)return`${BY[id].name} เกิน ${DK.max} ใบ`}
 const l=cards.filter(id=>BY[id].type==='character'&&BY[id].level===15).length;return l<DK.min15?`ต้องมี Lv.15 อย่างน้อย ${DK.min15} ใบ (ตอนนี้ ${l})`:null}
const activeDeck=()=>DS.list.find(d=>d.id===DS.active&&!deckProblem(d.cards)&&!evoProblem(d.evo));
const myIds=()=>activeDeck()?.cards||null;
const myCards=()=>myIds()?myIds().map(id=>({...BY[id]})):deck();
const myEvoIds=()=>activeDeck()?.evo||null;
const myExtra=main=>myEvoIds()?myEvoIds().map(id=>({...BY[id]})):formsOf(chainsOf(main),true);
function deck(){const pick=a=>a[Math.floor(Math.random()*a.length)],chars=DEFS.filter(d=>d.type==='character'),all=[...new Set(chars.map(d=>d.chain))],pc=new Set(PAIRS.flatMap(p=>[p.a,p.b])),
 ch=all.sort(()=>Math.random()-.5).sort((x,y)=>(pc.has(y)?1:0)-(pc.has(x)?1:0)).slice(0,7),d=[],n={};
 const put=c=>{if(!c||(n[c.id]||0)>=DK.max||d.length>=DK.size)return;n[c.id]=(n[c.id]||0)+1;d.push({...c})};
 for(const k of ch){const a=chars.find(x=>x.chain===k&&x.level===15);for(let i=0;i<3;i++)put(a)}
 for(let i=0;i<3;i++)put(BY['EVO-001']);if(PAIRS.length)for(let i=0;i<2;i++)put(BY['FUS-001']);
 const sp=DEFS.filter(x=>x.type==='spell'),tr=DEFS.filter(x=>x.type==='trap');
 for(let g=0;d.length<DK.size&&g<400&&(sp.length||tr.length);g++)put(pick(g%3===2&&tr.length?tr:sp.length?sp:tr));
 const l15=chars.filter(x=>x.level===15);for(let g=0;d.length<DK.size&&g<400;g++)put(pick(l15));return d}
const chainsOf=m=>[...new Set(m.filter(c=>c.type==='character'&&c.chain).map(c=>c.chain))];
const isForm=c=>c.type==='character'&&c.level>15;
// forms the seat may use: own=true -> only what the player owns (max 3 each); own=false (bot) -> one of every form of those chains
const formsOf=(chains,own)=>DEFS.filter(c=>isForm(c)&&chains.includes(c.chain)&&(!own||(ME.inv[c.id]||0)>0)).sort((a,b)=>a.level-b.level).flatMap(c=>Array.from({length:own?Math.min(ME.inv[c.id],DK.max):1},()=>({...c}))).slice(0,DK.evoMax);
function view(c,extra={}){const d=BY[c.id]||c;return{chain_name:d.chainName||d.name,name:d.name,level:d.level||'',hp:d.hp,atk:d.atk,def:d.def,img:d.img,...extra}}
function toast(m){const t=document.createElement('div');t.className='t';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function start(){const mm=myCards(),bm=deck();G=E.createGame([mm,bm],Date.now()%1e9,Math.random()<.5?0:1,{fusionPairs:PAIRS,interactive:true,extras:[myExtra(mm),formsOf(chainsOf(bm),false)]});mode=null;sel=null;snap=take();render();drive()}
function take(){const m={};G.players.forEach((p,i)=>{m['lp'+i]=p.lp;p.field.forEach(u=>{if(u)m[u.uid]=[u.hp,u.atk+u.bonusAtk,u.def+u.bonusDef]})});return m}
function floats(old){const n=take();document.querySelectorAll('[data-uid]').forEach(el=>{const a=old[el.dataset.uid],b=n[el.dataset.uid];if(!a||!b)return;
 [[0,'❤'],[1,'⚔'],[2,'🛡']].forEach(([k,ic])=>{const d=b[k]-a[k];if(d)fl(el,(d>0?'+':'')+d+ic,d>0?'#7dffa0':'#ff8a80')})});
 [0,1].forEach(i=>{const d=n['lp'+i]-old['lp'+i];const el=document.querySelector('.lp[data-p="'+i+'"]');if(d&&el)fl(el,d,'#ff8a80')});snap=n}
function fl(el,t,c){const s=document.createElement('span');s.className='fl';s.textContent=t;s.style.color=c;el.appendChild(s);setTimeout(()=>s.remove(),1200)}
function cell(u,side,i,extra=''){if(!u)return`<div class="c ${extra}" data-z="f" data-s="${side}" data-i="${i}"></div>`;
 const isSel=sel===i&&side===0,done=u.attacked||u.summonedTurn===G.turn,lock=G.turn<u.lockedUntil;
 return`<div class="c ${extra} ${isSel?'sel':''} ${side===G.active&&G.phase==='battle'&&done?'done':''} ${lock?'lock':''}" data-z="f" data-s="${side}" data-i="${i}" data-uid="${u.uid}"><img src="${img(u.card)}"><span class="lv">${u.card.level||''}${u.fused?' ⛓':''}</span><span class="st"><b>♥${u.hp}</b><b style="color:${u.bonusAtk>0?'#7dffa0':'#fff'}">⚔${u.atk+u.bonusAtk}</b><b style="color:${u.bonusDef>0?"#7dffa0":"#fff"}">◈${u.def+u.bonusDef}</b></span></div>`}
function targets(){const t={f1:[],f0:[],b1:[],h:[],lp1:false};if(!mode)return t;const en=G.players[1],me=G.players[0];
 if(mode.k==='attack'){en.field.forEach((u,i)=>u&&t.f1.push(i));if(!t.f1.length)t.lp1=true}
 if(mode.k==='cast'){const id=mode.id;if(['SPL-001','SPL-009'].includes(id))en.field.forEach((u,i)=>u&&t.f1.push(i));
  else if(['SPL-002','SPL-003','SPL-004'].includes(id))me.field.forEach((u,i)=>u&&t.f0.push(i));
  else if(id==='SPL-007')me.field.forEach((u,i)=>{if(mode.a===undefined?u:i!==mode.a)t.f0.push(i)});
  else if(id==='SPL-010')en.back.forEach((b,i)=>b&&t.b1.push(i))}
 if(mode.k==='fuse'){me.hand.forEach((c,i)=>{if(i===mode.f||mode.picks.includes(i))return;if(mode.picks.length?E.fusionBonus(G,me.hand[mode.picks[0]],c):me.hand.some((o,j)=>j!==i&&j!==mode.f&&E.fusionBonus(G,c,o)))t.h.push(i)})}
 if(mode.k==='evo')me.field.forEach((u,i)=>u&&i!==mode.slot&&!mode.sac.includes(i)&&t.f0.push(i));return t}
function render(){const me=G.players[0],en=G.players[1],T=targets(),my=G.active===0&&!G.winner&&!busy&&!G.pending;
 const hint=mode?`<div class="hint">${mode.k==='attack'?'เลือกเป้าหมายโจมตี':mode.k==='fuse'?(mode.picks.length?'เลือกการ์ดใบล่าง (คู่ Fusion)':'เลือกการ์ดใบบน'):mode.k==='evo'?`เลือกตัวละครที่จะสังเวย (${mode.sac.length}/${mode.need})`:mode.id==='SPL-007'?(mode.a===undefined?'เลือกตัวละครของคุณ':'เลือกช่องที่จะสลับ'):'เลือกเป้าหมาย'} <button class="r" id="cx" style="padding:3px 10px">ยกเลิก</button></div>`:'';
 $('#app').innerHTML=`<div class="bar"><span>เทิร์น ${G.turn} · ${G.active===0?'ของคุณ':'ศัตรู'} · ${PH[G.phase]} <b id="tm"></b></span><span><button id="lgb" style="padding:3px 8px;font-size:12px">บันทึก</button>${ON&&G.winner===null?' <button id="lv" class="r" style="padding:3px 8px;font-size:12px">ยอมแพ้</button>':''}</span></div>
 <div class="bar"><span class="lp ${T.lp1?'tg':''}" data-z="lp" data-s="1" data-p="1" style="position:relative">👾 ศัตรู LP ${en.lp}</span><span>มือ ${en.hand.length} · เด็ค ${en.deck.length} · สุสาน ${en.grave.length}${en.extra?` · อีโว ${en.extra.length}`:''}</span></div>
 <div class="row b">${en.back.map((b,i)=>`<div class="c ${T.b1.includes(i)?'tg':''}" data-z="b" data-s="1" data-i="${i}">${b?`<img src="/assets/card-back.jpg">`:''}</div>`).join('')}</div>
 <div class="row f">${en.field.map((u,i)=>cell(u,1,i,T.f1.includes(i)?'tg':'')).join('')}</div>
 <div class="row f">${me.field.map((u,i)=>cell(u,0,i,T.f0.includes(i)?'tg':'')).join('')}</div>
 <div class="row b">${me.back.map((b,i)=>`<div class="c" data-z="b" data-s="0" data-i="${i}">${b?`<img src="${img(b.card)}" style="opacity:.8">`:''}</div>`).join('')}</div>
 <div class="bar"><span class="lp" data-z="lp" data-s="0" data-p="0" style="position:relative">🧑 คุณ LP ${me.lp}</span><span>เด็ค ${me.deck.length} · สุสาน ${me.grave.length}${me.extra?` · <button id="exb" style="padding:2px 8px;font-size:12px">🧬 อีโว ${me.extra.length}</button>`:''}</span></div>
 ${hint}<div class="hand">${me.hand.map((c,i)=>`<div class="c ${T.h.includes(i)?'tg':''}" data-z="h" data-s="0" data-i="${i}"><img src="${img(c)}"></div>`).join('')}</div>
 <div class="bar"><button id="nx" class="g" ${my&&!mode?'':'disabled'} style="flex:1">${G.phase==='main'?'ไปเฟสต่อสู้ ▶':'จบเทิร์น ⏭'}</button></div>
 ${showLog?`<div id="lg">${G.log.slice(-8).reverse().join('<br>')}</div>`:''}`;
 if(G.winner!==null){const w=G.winner===0;$('#md').className='on';$('#md').innerHTML=`<div class="box" style="text-align:center"><h2>${w?'🎉 คุณชนะ!':'💀 คุณแพ้'}</h2>${WHY()?`<p>${WHY()}</p>`:''}${ON&&ON.reward?`<p style="color:#ffd54a">🎁 ได้ +${ON.reward.points} แต้ม${ON.reward.vrcoin?` และ +${ON.reward.vrcoin} Vrcoin 🪙`:''} (แมตช์ที่ ${ON.reward.matches})</p>`:ON&&G.winner!==null?'<p style="color:#bba;font-size:11px">แมตช์นี้ไม่ได้รับรางวัล (จบเร็วเกินไป หรือยังไม่มีโปรไฟล์)</p>':''}<button id="again">เล่นใหม่</button></div>`;$('#again').onclick=()=>{if(ON)location.href='/play';else{$('#md').className='';start()}}}
 if(G.winner===null&&G.pending&&G.pending.responder===0&&!busy)respModal();else if(G.pending===undefined&&$('#md .resp'))closeM();
 if(snap)floats(snap)}
const EV={on_attack:'ศัตรูโจมตี',on_attack_direct:'ศัตรูโจมตีตรงที่ผู้เล่น',on_summon:'ศัตรูเรียกตัวละคร',on_evolve:'ศัตรูกำลังวิวัฒนาการ',turn_start:'เทิร์นของศัตรูเริ่ม',turn_end:'เทิร์นของศัตรูกำลังจบ',on_destroyed:'ตัวละครของคุณกำลังจะถูกทำลาย',to_graveyard:'ตัวละครของคุณลงสุสาน'};
function respModal(){const P=G.pending,b=G,ac=P.action;let more='';
 if(ac.t==='attack'){const a=b.players[b.active].field[ac.from],t=ac.to==='player'?'ผู้เล่น':b.players[1-b.active].field[ac.to]?.card.name;more=`<p>${a?.card.name||''} → ${t||''}</p>`}
 $('#md').className='on';$('#md').innerHTML=`<div class="box resp" style="text-align:center"><h3 style="margin:4px 0">⚡ ตอบโต้ด้วยกับดัก?</h3><p>${EV[P.event]||P.event}</p>${more}
 <div class="acts">${P.options.map(i=>{const c=G.players[0].back[i].card;return`<button data-r="${i}" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px"><img src="${img(c)}" style="width:72px;border-radius:5px"><span style="font-size:11px">${c.name}</span></button>`}).join('')}<button class="r" data-r="-1">ผ่าน</button></div></div>`;
 document.querySelectorAll('[data-r]').forEach(el=>el.onclick=()=>{closeM();go(+el.dataset.r<0?{t:'pass'}:{t:'respond',back:+el.dataset.r})})}
let ON=null,poll=null,acting=false;
function WHY(){if(!ON||!ON.endReason)return'';const y=ON.forfeitedYou;return({timeout:y?'คุณหมดเวลาติดกันหลายครั้ง':'ศัตรูหมดเวลาติดกันหลายครั้ง',absent:y?'คุณหลุดจากห้อง':'ศัตรูหลุดจากห้อง',left:y?'คุณยอมแพ้':'ศัตรูยอมแพ้หรือออกจากห้อง'})[ON.endReason]||''}
function tickTm(){const el=$('#tm');if(!el)return;if(!ON||!ON.deadline||!G||G.winner!==null){el.textContent='';return}
 const left=Math.max(0,Math.ceil((ON.deadline-(Date.now()+(ON.skew||0)))/1000)),mine=(G.pending?G.pending.responder:G.active)===0;
 el.textContent=(mine?'⏱ คุณ ':'⏱ ศัตรู ')+left+' วิ';el.style.color=left<=15?'#ff8a80':'#f3e2b0'}
setInterval(tickTm,500);
const OA=(p,o={})=>API('/rooms'+p,o,ON?{authorization:'Bearer '+ON.token}:{});
async function pollNow(){if(!ON)return;try{const r=await OA('/'+ON.code+'?since='+(ON.version??-1));ON.version=r.version;if(r.serverNow){ON.deadline=r.deadline;ON.skew=r.serverNow-Date.now()}ON.endReason=r.endReason||null;ON.forfeitedYou=r.forfeitedYou;ON.reward=r.reward||null;if(r.status==='waiting'||r.unchanged||!r.game)return;
 if(!ON.started){ON.started=true;closeM();history.replaceState(null,'','/play')}
 G=r.game;if(!snap)snap=take();render();tickTm();if(G.winner!==null)clearInterval(poll)}catch(e){}}
function startPoll(){clearInterval(poll);pollNow();poll=setInterval(pollNow,1500)}

 <p style="text-align:center;font-size:11px;color:#bba;margin:4px 0">เล่น PvP จบ 1 แมตช์ได้ ${ME.rules?.matchPoints||200} แต้ม · ทุก ${ME.rules?.vrcoinEvery||10} แมตช์ได้ ${ME.rules?.vrcoinBatch||10} Vrcoin (อีก ${ME.matchesToVrcoin} แมตช์) · ซื้อได้ไม่เกิน ${sh.maxCopies} ใบต่อการ์ด</p>
 <div class="acts" style="margin:4px 0">${[40,70].map(l=>`<button data-l="${l}" style="${l===lv?'outline:2px solid #ffd54a':''}">Lv.${l}</button>`).join('')}</div>
 <p style="text-align:center;color:#ffd54a">${msg}</p>
 ${items.map(i=>{const d=BY[i.id]||{},full=i.owned>=sh.maxCopies,poor=i.price&&(i.price.currency==='points'?ME.points:ME.vrcoin)<i.price.amount;
  return`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #2a1244"><img src="${d.img||''}" data-pv="${i.id}" style="width:54px;border-radius:5px"><span style="flex:1;font-size:12px"><b>${i.name}</b><br><small style="color:#bba">${d.chainName||''} · ♥${d.hp??'-'} ⚔${d.atk??'-'} ◈${d.def??0}</small><br><small>มีแล้ว ${i.owned}/${sh.maxCopies}</small></span>
  ${i.price?`<button data-b="${i.id}" class="${poor||full?'':'g'}" style="padding:6px 10px;font-size:12px" ${full?'disabled':''}>${full?'ครบแล้ว':`${i.price.amount} ${i.price.currency==='points'?'💰':'🪙'}`}</button>`:'<small style="color:#bba">ยังไม่เปิดขาย</small>'}</div>`}).join('')||'<p style="text-align:center;color:#bba">ยังไม่มีการ์ดเลเวลนี้ในร้าน</p>'}
 <div class="acts"><button class="r" id="shx">ปิด</button></div></div>`;
 document.querySelectorAll('[data-l]').forEach(el=>el.onclick=()=>shop(+el.dataset.l));
 document.querySelectorAll('[data-pv]').forEach(el=>el.onclick=()=>detail(BY[el.dataset.pv],'shop',0));
 document.querySelectorAll('[data-b]').forEach(el=>el.onclick=async()=>{const i=items.find(x=>x.id===el.dataset.b);try{await API('/shop/buy',{method:'POST',body:JSON.stringify({cardId:i.id})});shop(lv,'ซื้อ '+i.name+' แล้ว ✅ (ไปใส่ในเด็คอีโวที่หน้า เด็คของฉัน)')}catch(e){shop(lv,'⚠ '+e.message)}});
 $('#shx').onclick=()=>lobby()}
function extraView(){const me=G.players[0];$('#md').className='on';$('#md').innerHTML=`<div class="box" style="text-align:center"><h3 style="margin:2px 0">🧬 เด็คอีโวของคุณ (${me.extra.length})</h3><p>ใช้การ์ดวิวัฒนาการแล้วเลือกร่างจากที่นี่ได้เลย ไม่ต้องรอจั่ว</p>
 <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">${me.extra.map(c=>`<div style="width:30%"><img src="${img(c)}" style="width:100%;border-radius:6px"><div style="font-size:11px">${c.name}<br>Lv.${c.level}</div></div>`).join('')||'<p style="color:#bba">ยังไม่มีการ์ดในเด็คอีโว (ซื้อที่ร้านค้า)</p>'}</div>
 <div class="acts"><button class="r" id="exc">ปิด</button></div></div>`;$('#exc').onclick=closeM}
function closeM(){$('#md').className='';$('#md').innerHTML=''}
function castStart(h,id){const need=['SPL-001','SPL-002','SPL-003','SPL-004','SPL-007','SPL-009','SPL-010'].includes(id);
 if(!need){go({t:'cast',hand:h});return}mode={k:'cast',hand:h,id};render()}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-z]');
 if(ev.target.id==='cx'){mode=null;render();return}if(ev.target.id==='nx'){go({t:'next'});return}if(ev.target.id==='lgb'){showLog=!showLog;render();return}if(ev.target.id==='exb'){extraView();return}if(ev.target.id==='lv'){if(confirm('ยอมแพ้และออกจากห้อง?'))OA('/'+ON.code+'/leave',{method:'POST'}).then(pollNow).catch(e=>toast(e.message));return}
 if(!el||busy||G.pending)return;const z=el.dataset.z,s=+el.dataset.s,i=+el.dataset.i;
 if(mode){const T=targets(),k=mode.k;
  if(k==='attack'){if(z==='f'&&s===1&&T.f1.includes(i))go({t:'attack',from:mode.from,to:i});else if(z==='lp'&&s===1&&T.lp1)go({t:'attack',from:mode.from,to:'player'});return}
  if(k==='fuse'){if(z==='h'&&s===0&&T.h.includes(i)){mode.picks.push(i);if(mode.picks.length===2)go({t:'fuse',fusion:mode.f,top:mode.picks[0],bottom:mode.picks[1],slot:Math.max(0,G.players[0].field.findIndex(x=>!x))});else render()}return}
  if(k==='evo'){if(z==='f'&&s===0&&T.f0.includes(i)){mode.sac.push(i);if(mode.sac.length===mode.need)go({t:'evolve',slot:mode.slot,evo:mode.evo,form:mode.form,sacrifice:mode.sac});else render()}return}
  if(k==='cast'){const id=mode.id;if(id==='SPL-007'){if(z==='f'&&s===0){if(mode.a===undefined){mode.a=i;render()}else go({t:'cast',hand:mode.hand,target:{slot:mode.a,slot2:i}})}else if(mode.a!==undefined&&z==='f'&&s===0){}return}
   if((z==='f'&&((s===1&&T.f1.includes(i))||(s===0&&T.f0.includes(i))))||(z==='b'&&s===1&&T.b1.includes(i)))go({t:'cast',hand:mode.hand,target:{slot:i}});return}}
 if(z==='h'){detail(G.players[0].hand[i],'h',i)}
 else if(z==='f'){const u=G.players[s].field[i];if(u)detail(u.card,s===0?'f':'x',i)}
 else if(z==='b'&&s===0){const b=G.players[0].back[i];if(b)detail(b.card,'x',i)}});
let driving=false;
async function drive(){if(driving)return;driving=true;busy=true;render();let n=0;
 while(G.winner===null&&n++<80){const human=G.pending?G.pending.responder===0:G.active===0;if(human)break;await sleep(650);
  try{G=E.act(G,E.botPick(G))}catch(e){try{G=E.act(G,{t:G.pending?'pass':'next'})}catch(e2){break}}render()}
 driving=false;busy=false;render()}
const JN=new URLSearchParams(location.search).get('join');if(JN)joinRoom(JN.toUpperCase());else if(/demo/.test(location.search))start();else lobby();
</script></body></html>
